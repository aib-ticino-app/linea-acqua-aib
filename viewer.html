<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracciato Condotta AIB - Parco Ticino</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        #info-box {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px 15px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-size: 13px; max-width: 250px;
        }
        #info-box h4 { margin: 0 0 5px 0; color: #003399; font-size: 14px; }
    </style>
</head>
<body>
    <div id="info-box">
        <h4>Tracciato AIB</h4>
        <div id="details">Caricamento percorso in corso...</div>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([45.55, 8.70], 14);

        // Tile layer OpenTopoMap specifico per i boschi
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap'
        }).addTo(map);

        // Leggi i dati passati nell'URL (hash o query params)
        function getCoordsFromUrl() {
            try {
                let hash = window.location.hash;
                if (hash.includes("viewer=")) {
                    let encoded = hash.split("viewer=")[1];
                    let jsonString = decodeURIComponent(encoded);
                    return JSON.parse(jsonString);
                }
                let params = new URLSearchParams(window.location.search);
                if (params.has("viewer")) {
                    return JSON.parse(decodeURIComponent(params.get("viewer")));
                }
            } catch(e) {
                console.error("Errore lettura coordinate:", e);
            }
            return null;
        }

        const punti = getCoordsFromUrl();
        if (punti && punti.length > 0) {
            let latLngs = punti.map(p => [p.lat, p.lng]);

            // Disegna la polilinea blu della condotta
            const polyline = L.polyline(latLngs, {color: '#003399', weight: 5, opacity: 0.8}).addTo(map);
            map.fitBounds(polyline.getBounds(), {padding: [50, 50]});

            // Marker Partenza (A)
            L.marker([punti[0].lat, punti[0].lng]).addTo(map)
                .bindPopup("<b>Partenza (A)</b>");

            // Marker Arrivo (B)
            if (punti.length > 1) {
                L.marker([punti[punti.length-1].lat, punti[punti.length-1].lng]).addTo(map)
                    .bindPopup("<b>Arrivo (B)</b>");
            }

            // Ostacoli / Punti intermedi
            for (let i = 1; i < punti.length - 1; i++) {
                L.circleMarker([punti[i].lat, punti[i].lng], {
                    radius: 6, color: '#fff', fillColor: '#ff9800', fillOpacity: 1, weight: 2
                }).addTo(map).bindPopup("<b>Punto / Ostacolo " + i + "</b>");
            }

            document.getElementById('details').innerHTML = "<b>Punti registrati:</b> " + punti.length + "<br>Tracciato caricato correttamente.";
        } else {
            document.getElementById('details').innerHTML = "Nessun tracciato specificato.";
        }

        // Geolocalizzazione utente in tempo reale nel bosco
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                if (!window.userMarker) {
                    window.userMarker = L.circleMarker([lat, lng], {
                        radius: 8, color: '#fff', fillColor: '#2196F3', fillOpacity: 1, weight: 3
                    }).addTo(map).bindPopup("La tua posizione GPS");
                } else {
                    window.userMarker.setLatLng([lat, lng]);
                }
            }, err => console.log(err), {enableHighAccuracy: true});
        }
    </script>
</body>
</html>
